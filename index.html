  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

dding:0 4px;z-index:50\">\n    <button sc-camel-on-click=\"{{ toggleStart }}\" style=\"display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;background:#c0c0c0;border:0;box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf;font:bold 13px Tahoma,sans-serif;cursor:pointer\" style-active=\"box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #fff,inset 2px 2px 0 #808080,inset -2px -2px 0 #dfdfdf\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" shape-rendering=\"crispEdges\"><rect x=\"1\" y=\"1\" width=\"6\" height=\"6\" fill=\"#ff3b30\"><\/rect><rect x=\"9\" y=\"1\" width=\"6\" height=\"6\" fill=\"#4cd964\"><\/rect><rect x=\"1\" y=\"9\" width=\"6\" height=\"6\" fill=\"#3b7dff\"><\/rect><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\" fill=\"#ffcc00\"><\/rect><\/svg>Start<\/button>\n    <sc-if value=\"{{ windowOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <button sc-camel-on-click=\"{{ minimize }}\" style=\"height:26px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#c0c0c0;border:0;box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #fff,inset 2px 2px 0 #808080,inset -2px -2px 0 #dfdfdf;font:bold 12px Tahoma,sans-serif;cursor:pointer\">\n      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" shape-rendering=\"crispEdges\"><rect x=\"1\" y=\"1\" width=\"6\" height=\"6\" fill=\"#ff3b30\"><\/rect><rect x=\"9\" y=\"1\" width=\"6\" height=\"6\" fill=\"#4cd964\"><\/rect><rect x=\"1\" y=\"9\" width=\"6\" height=\"6\" fill=\"#3b7dff\"><\/rect><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\" fill=\"#ffcc00\"><\/rect><\/svg>Hank.exe<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{ minimized }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ restore }}\" style=\"height:26px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#c0c0c0;border:0;box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf;font:12px Tahoma,sans-serif;cursor:pointer\" style-active=\"box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #fff,inset 2px 2px 0 #808080,inset -2px -2px 0 #dfdfdf\">\n      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" shape-rendering=\"crispEdges\"><rect x=\"1\" y=\"1\" width=\"6\" height=\"6\" fill=\"#ff3b30\"><\/rect><rect x=\"9\" y=\"1\" width=\"6\" height=\"6\" fill=\"#4cd964\"><\/rect><rect x=\"1\" y=\"9\" width=\"6\" height=\"6\" fill=\"#3b7dff\"><\/rect><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\" fill=\"#ffcc00\"><\/rect><\/svg>Hank.exe<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{ msOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ closeMinesweeper }}\" style=\"height:26px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#c0c0c0;border:0;box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #fff,inset 2px 2px 0 #808080,inset -2px -2px 0 #dfdfdf;font:bold 12px Tahoma,sans-serif;cursor:pointer\">\n      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\"><rect width=\"16\" height=\"16\" fill=\"#c0c0c0\"><\/rect><circle cx=\"8\" cy=\"8\" r=\"4\" fill=\"#000\"><\/circle><path d=\"M8 1v14M1 8h14M3 3l10 10M13 3L3 13\" stroke=\"#000\" stroke-width=\"1.4\"><\/path><\/svg>Minesweeper<\/button>\n    <\/sc-if>\n    <div style=\"margin-left:auto;height:24px;display:flex;align-items:center;padding:0 12px;box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff;font:12px Tahoma,sans-serif\">{{ clock }}<\/div>\n    <sc-if value=\"{{ startOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:4px;bottom:34px;width:230px;display:flex;background:#c0c0c0;padding:3px;box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 #dfdfdf,inset -2px -2px 0 #808080,inset 2px 2px 0 #fff,4px 4px 0 rgba(0,0,0,.35);z-index:60\">\n      <div style=\"width:24px;background:linear-gradient(#000080,#1084d0);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px\">\n        <span style=\"writing-mode:vertical-rl;transform:rotate(180deg);font:bold 15px Tahoma,sans-serif;color:#fff;letter-spacing:.06em\">Windows<span style=\"font-weight:400\">95<\/span><\/span>\n      <\/div>\n      <div style=\"flex:1;display:flex;flex-direction:column;padding:2px 0\">\n        <div sc-camel-on-mouse-over=\"{{ openPrograms }}\" sc-camel-on-click=\"{{ openPrograms }}\" style=\"position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;font:14px Tahoma,sans-serif;cursor:pointer\" style-hover=\"background:#000080;color:#fff\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 32 32\" shape-rendering=\"crispEdges\"><path d=\"M2 8h11l3 3h14v17H2z\" fill=\"#ffd24a\" stroke=\"#000\" stroke-width=\"2\"><\/path><path d=\"M2 12h28v16H2z\" fill=\"#ffe89a\" stroke=\"#000\" stroke-width=\"2\"><\/path><\/svg>\n          <span style=\"flex:1\"><u>P<\/u>rograms<\/span><span style=\"font-size:10px\">\u25b6<\/span>\n        <\/div>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;font:14px Tahoma,sans-serif;color:#808080;text-shadow:1px 1px 0 #fff;cursor:default\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 32 32\" shape-rendering=\"crispEdges\"><path d=\"M6 3h14l6 6v20H6z\" fill=\"#fff\" stroke=\"#808080\" stroke-width=\"2\"><\/path><path d=\"M19 3v7h7\" fill=\"#dfdfdf\" stroke=\"#808080\" stroke-width=\"2\"><\/path><\/svg>\n          <span style=\"flex:1\"><u>D<\/u>ocuments<\/span><span style=\"font-size:10px\">\u25b6<\/span>\n        <\/div>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;font:14px Tahoma,sans-serif;color:#808080;text-shadow:1px 1px 0 #fff;cursor:default\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"#dfdfdf\" stroke=\"#808080\" stroke-width=\"2\"><\/circle><circle cx=\"16\" cy=\"16\" r=\"4\" fill=\"#808080\"><\/circle><\/svg>\n          <span style=\"flex:1\"><u>S<\/u>ettings<\/span><span style=\"font-size:10px\">\u25b6<\/span>\n        <\/div>\n        <div style=\"height:2px;margin:4px 6px;box-shadow:inset 0 1px 0 #808080,inset 0 -1px 0 #fff\"><\/div>\n        <div sc-camel-on-click=\"{{ closeStart }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;font:14px Tahoma,sans-serif;cursor:pointer\" style-hover=\"background:#000080;color:#fff\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"12\" fill=\"#e02020\" stroke=\"#000\" stroke-width=\"2\"><\/circle><rect x=\"14\" y=\"5\" width=\"4\" height=\"12\" fill=\"#fff\"><\/rect><\/svg>\n          <span style=\"flex:1\">Sh<u>u<\/u>t Down...<\/span>\n        <\/div>\n      <\/div>\n      <sc-if value=\"{{ programsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;left:224px;top:4px;width:196px;background:#c0c0c0;padding:3px;box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 #dfdfdf,inset -2px -2px 0 #808080,inset 2px 2px 0 #fff,4px 4px 0 rgba(0,0,0,.35)\">\n        <div sc-camel-on-click=\"{{ openMinesweeper }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;font:14px Tahoma,sans-serif;cursor:pointer\" style-hover=\"background:#000080;color:#fff\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 32 32\"><rect width=\"32\" height=\"32\" fill=\"#c0c0c0\"><\/rect><circle cx=\"16\" cy=\"16\" r=\"8\" fill=\"#000\"><\/circle><path d=\"M16 2v28M2 16h28M6 6l20 20M26 6L6 26\" stroke=\"#000\" stroke-width=\"2.5\"><\/path><circle cx=\"13\" cy=\"13\" r=\"2\" fill=\"#fff\"><\/circle><\/svg>\n          <span>Minesweeper<\/span>\n        <\/div>\n      <\/div>\n      <\/sc-if>\n    <\/div>\n    <\/sc-if>\n  <\/div>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;desktop&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;teal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;teal&quot;,&quot;navy&quot;,&quot;plum&quot;,&quot;clouds&quot;],&quot;section&quot;:&quot;Desktop&quot;},&quot;taskbar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Desktop&quot;},&quot;photoFilter&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;bw&quot;,&quot;crt&quot;],&quot;section&quot;:&quot;Photo&quot;}}\">\nclass Component extends DCLogic {\n  state = { status: 'Ready.', ytOpen: false, aboutOpen: false, minimized: false, now: Date.now(),\n            startOpen: false, programsOpen: false, msOpen: false, closed: false,\n            board: null, game: 'ready', startedAt: null, endedAt: null, boom: -1 };\n  componentDidMount(){ this.t = setInterval(() => this.setState({ now: Date.now() }), 1000); }\n  componentWillUnmount(){ clearInterval(this.t); this.stopMarquee(); }\n\n  startMarquee(e){\n    if (e.target !== e.currentTarget || e.button !== 0) return;\n    e.preventDefault();\n    const x0 = e.clientX, y0 = e.clientY;\n    this.setState({ marquee: { x: x0, y: y0, w: 0, h: 0 }, startOpen: false, programsOpen: false });\n    const move = ev => this.setState({ marquee: {\n      x: Math.min(x0, ev.clientX), y: Math.min(y0, ev.clientY),\n      w: Math.abs(ev.clientX - x0), h: Math.abs(ev.clientY - y0) } });\n    const up = () => { this.stopMarquee(); this.setState({ marquee: null }); };\n    this._mq = { move, up };\n    window.addEventListener('mousemove', move);\n    window.addEventListener('mouseup', up);\n  }\n\n  stopMarquee(){\n    if (!this._mq) return;\n    window.removeEventListener('mousemove', this._mq.move);\n    window.removeEventListener('mouseup', this._mq.up);\n    this._mq = null;\n  }\n\n  buildBoard(first){\n    const N = 9, M = 10;\n    const cells = Array.from({length: N*N}, () => ({mine:false, adj:0, rev:false, flag:false}));\n    const banned = new Set(), r0 = Math.floor(first/N), c0 = first%N;\n    for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++){\n      const r=r0+dr, c=c0+dc;\n      if (r>=0 && r<N && c>=0 && c<N) banned.add(r*N+c);\n    }\n    let placed = 0;\n    while (placed < M){\n      const i = Math.floor(Math.random()*N*N);\n      if (cells[i].mine || banned.has(i)) continue;\n      cells[i].mine = true; placed++;\n    }\n    cells.forEach((cell, i) => {\n      const r = Math.floor(i/N), c = i%N;\n      let n = 0;\n      for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++){\n        const rr=r+dr, cc=c+dc;\n        if ((dr||dc) && rr>=0 && rr<N && cc>=0 && cc<N && cells[rr*N+cc].mine) n++;\n      }\n      cell.adj = n;\n    });\n    return cells;\n  }\n\n  flood(cells, i){\n    const N = 9, stack = [i];\n    while (stack.length){\n      const k = stack.pop(), cell = cells[k];\n      if (cell.rev || cell.flag) continue;\n      cell.rev = true;\n      if (cell.adj) continue;\n      const r = Math.floor(k/N), c = k%N;\n      for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++){\n        const rr=r+dr, cc=c+dc;\n        if ((dr||dc) && rr>=0 && rr<N && cc>=0 && cc<N) stack.push(rr*N+cc);\n      }\n    }\n  }\n\n  resetGame(){ this.setState({ board: null, game: 'ready', startedAt: null, endedAt: null, boom: -1 }); }\n\n  cellClick(i){\n    if (this.state.game === 'lost' || this.state.game === 'won') return;\n    let board = this.state.board, startedAt = this.state.startedAt;\n    if (!board){ board = this.buildBoard(i); startedAt = Date.now(); }\n    else board = board.map(c => ({...c}));\n    const cell = board[i];\n    if (cell.flag || cell.rev) return;\n    if (cell.mine){\n      board.forEach(c => { if (c.mine) c.rev = true; });\n      this.setState({ board, startedAt, game: 'lost', endedAt: Date.now(), boom: i });\n      return;\n    }\n    this.flood(board, i);\n    const won = board.every(c => c.mine || c.rev);\n    if (won) board.forEach(c => { if (c.mine) c.flag = true; });\n    this.setState({ board, startedAt, game: won ? 'won' : 'playing', endedAt: won ? Date.now() : null });\n  }\n\n  cellFlag(i){\n    if (!this.state.board || this.state.game === 'lost' || this.state.game === 'won') return;\n    const board = this.state.board.map(c => ({...c}));\n    if (board[i].rev) return;\n    board[i].flag = !board[i].flag;\n    this.setState({ board });\n  }\n  renderVals(){\n    const desks = {\n      teal: '#008080',\n      navy: '#000040',\n      plum: '#503050',\n      clouds: 'linear-gradient(#5aa0e0,#a8d0f0 60%,#dcecfa)'\n    };\n    const filters = { none:'none', bw:'grayscale(1) contrast(1.15)', crt:'contrast(1.1) saturate(.85) brightness(1.05)' };\n    const NUMCOL = ['','#0000ff','#008000','#ff0000','#000080','#800000','#008080','#000000','#808080'];\n    const CELL = 'box-sizing:border-box;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font:bold 15px \"IBM Plex Mono\",monospace;line-height:1;user-select:none;cursor:default;';\n    const board = this.state.board;\n    const cells = Array.from({length: 81}, (_, i) => {\n      const c = board ? board[i] : {mine:false, adj:0, rev:false, flag:false};\n      if (!c.rev) return { i, label: c.flag ? '\\u2691' : '', style: CELL + 'background:#c0c0c0;box-shadow:inset -2px -2px 0 #808080,inset 2px 2px 0 #fff;color:' + (c.flag ? '#d00000' : '#000') };\n      if (c.mine) return { i, label: '\\u25cf', style: CELL + 'border:1px solid #9a9a9a;color:#000;background:' + (this.state.boom === i ? '#e02020' : '#c0c0c0') };\n      return { i, label: c.adj ? String(c.adj) : '', style: CELL + 'border:1px solid #9a9a9a;background:#c0c0c0;color:' + NUMCOL[c.adj] };\n    });\n    const flags = board ? board.filter(c => c.flag).length : 0;\n    const pad3 = n => String(Math.max(0, Math.min(999, n))).padStart(3, '0');\n    const endT = this.state.endedAt ?? this.state.now;\n    const elapsed = this.state.startedAt ? Math.floor((endT - this.state.startedAt)/1000) : 0;\n    return {\n      status: this.state.status,\n      startOpen: this.state.startOpen,\n      programsOpen: this.state.programsOpen,\n      msOpen: this.state.msOpen,\n      cells,\n      mineCount: pad3(10 - flags),\n      timeStr: pad3(elapsed),\n      faceOk: this.state.game !== 'lost' && this.state.game !== 'won',\n      faceWon: this.state.game === 'won',\n      faceLost: this.state.game === 'lost',\n      msStatus: this.state.game === 'won' ? 'You win! Nice sweeping.' : this.state.game === 'lost' ? 'Boom. Click the face to retry.' : 'Left-click to dig, right-click to flag.',\n      marqueeOn: !!this.state.marquee,\n      marqueeStyle: this.state.marquee\n        ? 'position:fixed;pointer-events:none;z-index:80;border:1px dotted #fff;outline:1px dotted #000;background:rgba(255,255,255,.10);left:' + this.state.marquee.x + 'px;top:' + this.state.marquee.y + 'px;width:' + this.state.marquee.w + 'px;height:' + this.state.marquee.h + 'px'\n        : 'display:none',\n      startMarquee: e => this.startMarquee(e),\n      toggleStart: () => this.setState(s => ({ startOpen: !s.startOpen, programsOpen: false })),\n      openPrograms: () => this.setState({ programsOpen: true }),\n      closeStart: () => this.setState({ startOpen: false, programsOpen: false }),\n      openMinesweeper: () => this.setState({ startOpen: false, programsOpen: false, msOpen: true, minimized: false }),\n      closeMinesweeper: () => this.setState({ msOpen: false }),\n      resetGame: () => this.resetGame(),\n      onCellClick: (e) => { const el = e.target.closest('[data-i]'); if (el) this.cellClick(Number(el.getAttribute('data-i'))); },\n      onCellFlag: (e) => { e.preventDefault(); const el = e.target.closest('[data-i]'); if (el) this.cellFlag(Number(el.getAttribute('data-i'))); },\n      ytOpen: this.state.ytOpen,\n      aboutOpen: this.state.aboutOpen,\n      desktopBg: desks[this.props.desktop ?? 'teal'] || desks.teal,\n      photoFilter: filters[this.props.photoFilter ?? 'none'] || 'none',\n      showTaskbar: (this.props.taskbar ?? true) || this.state.minimized || this.state.msOpen,\n      windowOpen: !this.state.minimized && !this.state.closed,\n      minimized: this.state.minimized && !this.state.closed,\n      windowClosed: this.state.closed,\n      minimize: () => this.setState({ minimized: true, ytOpen: false, aboutOpen: false, status: 'Ready.' }),\n      restore: () => this.setState({ minimized: false }),\n      closeWindow: () => this.setState({ closed: true, minimized: false, ytOpen: false, aboutOpen: false, status: 'Ready.' }),\n      openWindow: () => this.setState({ closed: false, minimized: false }),\n      clock: new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Tokyo'}).format(new Date(this.state.now)),\n      onHoverItem: (e) => {\n        const el = e.target.closest('[data-status]');\n        if (el) this.setState({ status: el.getAttribute('data-status') });\n      },\n      onLeaveItem: () => this.setState({ status: 'Ready.' }),\n      toggleYt: () => this.setState(s => ({ ytOpen: !s.ytOpen })),\n      openAbout: () => this.setState({ aboutOpen: true }),\n      closeAbout: () => this.setState({ aboutOpen: false })\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
